[project]
name = "scopeguard"
version = "0.1.0"
description = "A local scope-creep guard for freelancers: reads the contract and the client's message with an open model, and shows what is not covered and what it is worth."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "httpx>=0.27", "jinja2>=3.1", "python-multipart>=0.0.9", "uvicorn[standard]>=0.30"]

[project.scripts]
scopeguard = "scopeguard.launch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scopeguard"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 125
target-version = "py312"
